[package]
name = "academic-bilingual-writer"
version = "0.1.0"
description = "中英双栏医学 SCI 论文写作工作台"
authors = ["Academic Bilingual Writer"]
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
futures-util = "0.3"
keyring = { version = "3", features = ["windows-native"] }
rfd = "0.17"

[profile.release]
lto = true
codegen-units = 1
strip = true
